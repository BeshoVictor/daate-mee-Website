<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>When to meet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Butterfly+Kids&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="Images/favicon2.JPG" type="image/x-icon" />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/media.css" />
  </head>
  <body>
    <section
      class="row vh-100 d-flex justify-content-center align-content-center main-bg-color"
    >
      <div
        class="content col-8 col-md-6 rounded-5 shadow-lg secondary-bg-color d-flex flex-column justify-content-center align-items-center p-3 p-md-5"
      >
        <h1 class="question display-5 text-center fw-bold mt-5">
          I Knew You Fell For Me😉
        </h1>
        <h2 class="question2 display-6 text-center">
          When Would You Like to Date?
        </h2>
        <form
          action="see-you.html"
          class="w-100 d-flex flex-column gap-5 justify-content-center align-items-center"
        >
          <div
            class="inputs d-flex gap-3 gap-md-5 justify-content-center align-content-center"
          >
            <div class="date-input d-flex flex-column">
              <label for="date">Date</label>
              <input type="date" id="date" />
            </div>

            <div class="time-input d-flex flex-column">
              <label for="time">Time</label>
              <input type="time" id="time" />
            </div>
          </div>
          <button type="submit" class="btn btn-outline-danger w-md-25">
            Let's Meet 💌
          </button>
        </form>
      </div>
    </section>

    <script src="js/main.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
