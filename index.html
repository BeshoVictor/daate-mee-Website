<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date Me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Butterfly+Kids&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="Images/favicon2.JPG" type="image/x-icon" />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/media.css" />
  </head>
  <body>
    <section
      class="row vh-100 d-flex justify-content-center align-content-center main-bg-color"
    >
      <div
        class="content col-8 col-md-6 rounded-5 shadow-lg secondary-bg-color d-flex flex-column justify-content-center align-items-center p-3 p-md-5"
      >
        <h1 class="display-4 text-center fw-bold my-5">
          Would You Like To Date Me, Baby?
        </h1>
        <div class="response-container row w-100 d-flex my-5">
          <div class="yes-container col-6 text-center">
            <a
              href="form.html"
              class="yes fw-bold display-5 yes-no-color text-decoration-none"
            >
              Yes
            </a>
          </div>
          <div class="no-container col-6 text-center">
            <p class="no fw-bold display-5 yes-no-color">No</p>
          </div>
        </div>
      </div>
    </section>

    <script src="js/main.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
